[package]
name = "portefeuille"
version = "0.1.0"
description = "Suivi financier local et chiffré"
edition = "2024"

[lib]
# Le suffixe _lib évite un conflit de nom avec l'exécutable sous Windows
name = "portefeuille_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1"
data-encoding = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
calamine = { version = "0.38.0", features = ["dates"] }
encoding_rs = "0.8.44"
ureq = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
