# À chaque envoi sur main : construit Sésame pour Windows, Android et Linux, publie la version
# (numéro 0.1.<n° d'exécution>) avec ses nouveautés (NOUVEAUTES.md) et latest.json, puis met le site à jour.
name: Version
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: version
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}

jobs:
  preparer:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 tools/test_nouveautes.py
      - id: v
        run: echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Nouveautés et latest.json
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern latest.json --output precedent.json || true
          python3 tools/nouveautes.py --version "${{ steps.v.outputs.version }}" --precedent precedent.json --sortie publication
          cp src/lib/nouveautes.json publication/
          echo '{"version":"${{ steps.v.outputs.version }}"}' > publication/version.json
      - uses: actions/upload-artifact@v4
        with:
          name: publication
          path: publication

  windows:
    needs: preparer
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: publication, path: publication }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: cp publication/nouveautes.json src/lib/ && npm ci
      - run: npx tauri build --bundles nsis --config publication/version.json
      - run: mkdir -p sortie && cp src-tauri/target/release/bundle/nsis/*-setup.exe sortie/Sesame-Windows-Setup.exe
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: sortie }

  linux:
    needs: preparer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: publication, path: publication }
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf file
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: cp publication/nouveautes.json src/lib/ && npm ci
      - run: npx tauri build --bundles appimage,deb --config publication/version.json
      - run: |
          mkdir -p sortie
          cp src-tauri/target/release/bundle/appimage/*.AppImage sortie/Sesame-Linux.AppImage
          cp src-tauri/target/release/bundle/deb/*.deb sortie/sesame-linux.deb
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: sortie }

  android:
    needs: preparer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: publication, path: publication }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # Le SDK Android est déjà installé sur la machine de GitHub : on ajoute seulement le NDK et les outils de signature
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "build-tools;36.0.0" > /dev/null
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: cp publication/nouveautes.json src/lib/ && npm ci
      - run: NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" npx tauri android build --apk --config publication/version.json
      - name: Signature (toujours la même clé, sinon Android refuse la mise à jour)
        env:
          CLE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          CLE_MDP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLE_MDP_CLE: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          echo "$CLE_B64" | base64 -d > "$RUNNER_TEMP/cle.jks"
          mkdir -p sortie
          "$BT/zipalign" -f -p 4 src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk aligne.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/cle.jks" --ks-key-alias portefeuille \
            --ks-pass env:CLE_MDP --key-pass env:CLE_MDP_CLE --out sortie/Sesame-Android.apk aligne.apk
          rm -f "$RUNNER_TEMP/cle.jks" sortie/*.idsig
          "$BT/apksigner" verify sortie/Sesame-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: sortie }

  publier:
    needs: [preparer, windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: a }
      - name: Version sur GitHub
        run: |
          V="${{ needs.preparer.outputs.version }}"
          cd a
          sha256sum windows/* android/* linux/* | sed 's#  [a-z]*/#  #' > SHA256SUMS.txt
          gh release create "v$V" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Sésame $V" --notes-file publication/release-body.md --latest \
            windows/Sesame-Windows-Setup.exe android/Sesame-Android.apk \
            linux/sesame-linux.deb linux/Sesame-Linux.AppImage \
            publication/latest.json SHA256SUMS.txt
      - name: Mise à jour du site (historique des versions)
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main
